services:
  db:
    image: postgres:17.7-alpine3.23
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opaline -d patchydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb

    environment:
      POSTGRES_USER: opaline
      POSTGRES_PASSWORD: youkai
      POSTGRES_DB: patchydb
    ports:
      - 5433:5432
    volumes:
      - db_data:/var/lib/postgresql/data
  admin:
    image: adminer
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8080:8080
volumes:
  db_data:


